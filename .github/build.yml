name: Prusa Colorin - Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      SRC: C:\ps
      DEPS: C:\psdeps

    steps:
      - name: Repo Prusa Colorin
        uses: actions/checkout@v4

      - name: Version base fija de PrusaSlicer
        id: ver
        shell: bash
        run: |
          # Version base fijada. Solo cambia cuando Arturo lo decida.
          TAG=version_2.9.6
          echo "Version base: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Descargar codigo de PrusaSlicer
        shell: cmd
        run: |
          git config --system core.longpaths true
          git clone --depth 1 --branch ${{ steps.ver.outputs.tag }} https://github.com/prusa3d/PrusaSlicer.git %SRC%

      - name: Cache de dependencias
        uses: actions/cache@v4
        with:
          path: C:\psdeps
          key: psdeps-${{ steps.ver.outputs.tag }}-v1

      - name: Insertar motor de color (Prusa Colorin)
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\colorin\libslic3r\*" "C:\ps\src\libslic3r\"
          $files = Get-ChildItem "$env:GITHUB_WORKSPACE\colorin\libslic3r" -Recurse -Include *.cpp,*.hpp,*.h |
                   ForEach-Object { $_.FullName.Substring("$env:GITHUB_WORKSPACE\colorin\libslic3r\".Length).Replace('\','/') }
          $lines = "`ntarget_sources(libslic3r PRIVATE`n" + (($files | ForEach-Object { "    $_" }) -join "`n") + "`n)`n"
          Add-Content -Path "C:\ps\src\libslic3r\CMakeLists.txt" -Value $lines
          Write-Host "Archivos del motor agregados: $($files.Count)"

      - name: Aplicar cambios de Prusa Colorin a PrusaSlicer 2.9.6
        shell: pwsh
        run: |
          # Archivos de PrusaSlicer 2.9.6 ya modificados para el motor de color.
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\colorin\prusa_2.9.6\src\*" "C:\ps\src\"
          Get-ChildItem "$env:GITHUB_WORKSPACE\colorin\prusa_2.9.6" -Recurse -File | ForEach-Object { Write-Host "Reemplazado: $($_.Name)" }

      - name: Compilar librerias (solo si no estan guardadas)
        shell: cmd
        working-directory: C:\ps
        run: |
          if exist C:\psdeps\NUL (
            echo Librerias ya guardadas, no se recompilan.
          ) else (
            call build_win.bat -d=%DEPS% -c=Release -s=deps
          )

      - name: Configurar Prusa Colorin
        shell: pwsh
        run: |
          # Busca la carpeta de librerias compiladas (usr\local), segun la documentacion de PrusaSlicer.
          $prefix = Get-ChildItem C:\psdeps -Directory -Recurse -Depth 4 -Filter local |
                    Where-Object { $_.Parent.Name -eq 'usr' } | Select-Object -First 1
          if (-not $prefix) { Write-Error "No se encontro la carpeta usr\local de las librerias"; exit 1 }
          Write-Host "Librerias: $($prefix.FullName)"
          cmake -S C:\ps -B C:\ps\build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$($prefix.FullName)"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Revisar nucleo (libslic3r)
        shell: pwsh
        run: |
          cmake --build C:\ps\build --config Release --target libslic3r -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { Write-Error "ERROR EN EL NUCLEO: copiar las lineas con 'error' de este paso"; exit 1 }

      - name: Compilar programa completo
        shell: pwsh
        run: |
          cmake --build C:\ps\build --config Release -- /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Empaquetar portable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path C:\ps\build -Recurse -Filter "prusa-slicer.exe" | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Path C:\ps\build -Recurse -Filter "PrusaSlicer.exe" | Select-Object -First 1 }
          if (-not $exe) { Write-Error "No se encontro el ejecutable"; exit 1 }
          Write-Host "Ejecutable: $($exe.FullName)"
          Compress-Archive -Path "$($exe.DirectoryName)\*" -DestinationPath "PrusaColorin-portable.zip"

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: PrusaColorin-portable
          path: PrusaColorin-portable.zip
