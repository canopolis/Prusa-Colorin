name: Prusa Colorin - Fuente 2.9.6

on:
  workflow_dispatch:

jobs:
  fuente:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar PrusaSlicer 2.9.6
        run: git clone --depth 1 --branch version_2.9.6 https://github.com/prusa3d/PrusaSlicer.git ps

      - name: Empaquetar solo el codigo C++ (sin recursos ni imagenes)
        run: |
          cd ps
          zip -qr ../PrusaSlicer_2.9.6_src.zip src/libslic3r src/slic3r src/CMakeLists.txt CMakeLists.txt deps/CMakeLists.txt \
            -i '*.cpp' '*.hpp' '*.h' '*.txt' '*.cmake'
          ls -la ../PrusaSlicer_2.9.6_src.zip

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer_2.9.6_src
          path: PrusaSlicer_2.9.6_src.zip
